name: CI/CD React App

on:
  push:
    branches: [development, master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        working-directory: ./client

      - name: Lint the code
        run: npm run lint --if-present
        working-directory: ./client

      - name: Test project
        run: npm test --if-present -- --ci --reporters=default --watch=false
        working-directory: ./client

      - name: Build project
        run: npm run build --if-present
        working-directory: ./client

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: client/dist
          if-no-files-found: warn

  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    # OPTION A: deploy only when pushing to master
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Download the artifact produced by the CI job
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: ./site

      # For single-page apps (React Router): ensure 404.html serves index.html
      # - name: SPA fallback (optional but recommended)
      #   run: |
      #     if [ -f "./site/index.html" ] && [ ! -f "./site/404.html" ]; then
      #       cp ./site/index.html ./site/404.html
      #     fi

      # Publish the site to the gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
